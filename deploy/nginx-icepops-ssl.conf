# nginx in front of the Icepops app, using your own SSL certificate.
# install-ssl.sh and use-server-cert.sh copy this to /etc/nginx/sites-available/icepops,
# filling in __DOMAIN__ and the certificate paths (__CERT__, __KEY__):
#   install-ssl.sh      uploaded files, kept in /etc/icepops/ssl/
#   use-server-cert.sh  the files your existing nginx sites already use, in place
# (Without your own certificate, nginx-icepops.conf and Let's Encrypt are used instead.)

# Slow down password guessing: 10 login or sign-up attempts a minute per visitor.
limit_req_zone $binary_remote_addr zone=icepops_auth:10m rate=10r/m;

upstream icepops_app {
    server 127.0.0.1:__PORT__;   # PORT in /etc/icepops/icepops.env
    keepalive 16;
}

# Plain http: send everyone to https.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    # "ssl http2" on the listen line works on the nginx versions Ubuntu ships (1.18 to 1.24).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;   # your certificate, then the CA's intermediate certificates
    ssl_certificate_key __KEY__;    # your private key
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:icepops_ssl:10m;
    ssl_session_timeout 1d;

    # Browsers remember to use https for this domain for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Visitor's real IP when requests come through Cloudflare (see deploy/cloudflare-realip.sh).
    include /etc/nginx/snippets/icepops-realip.conf;

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Passed to the app on every request. The app needs the real Host for its
    # same-site check, and X-Forwarded-Proto to mark login cookies Secure.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=icepops_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://icepops_app;
    }

    location / {
        proxy_pass http://icepops_app;
    }
}
