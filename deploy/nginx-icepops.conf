# nginx in front of the Icepops app (Node on 127.0.0.1:8000).
# setup-server.sh copies this to /etc/nginx/sites-available/icepops with your
# domain in place of __DOMAIN__, then certbot adds HTTPS on port 443 and the
# redirect from http to https.

# Slow down password guessing: 10 login or sign-up attempts a minute per visitor.
limit_req_zone $binary_remote_addr zone=icepops_auth:10m rate=10r/m;

upstream icepops_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Passed to the app on every request. The app needs the real Host for its
    # same-site check, and X-Forwarded-Proto to mark login cookies Secure.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=icepops_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://icepops_app;
    }

    location / {
        proxy_pass http://icepops_app;
    }
}
