<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icepops E-bill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.bill-page { max-width: 440px; gap: 18px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.find { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.find .add-btn { padding: 0 18px; }

/* The receipt */
.receipt-wrap { filter: drop-shadow(0 10px 18px var(--shadow)); }
.receipt {
  --tooth: 9px;
  display: grid; gap: 16px;
  padding: 26px 22px calc(var(--tooth) + 22px);
  background: var(--paper);
  border-radius: 14px 14px 0 0;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--tooth)) 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--tooth)) 100%;
}
.r-head { display: grid; gap: 2px; text-align: center; padding-bottom: 14px; border-bottom: 2px dashed var(--line); }
.r-shop { font: 400 2.5rem/1 var(--display); color: var(--accent); }
.r-line { font-size: .8125rem; color: var(--muted); }
.r-tag { margin-top: 6px; font: 500 .75rem/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.r-meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; margin: 0; font-size: .875rem; }
.r-meta dt { color: var(--muted); }
.r-meta dd { margin: 0; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.r-meta dd.mono { font-family: var(--mono); font-weight: 500; }

.r-items { width: 100%; border-collapse: collapse; font-size: .875rem; }
.r-items th { padding: 0 0 6px; text-align: left; font: 500 .6875rem/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.r-items td { padding: 8px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
.r-items .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
.r-items .item { font-weight: 600; overflow-wrap: anywhere; }

.r-total { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 4px; border-top: 2px dashed var(--line); }
.r-total-label { font: 500 .75rem/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.r-total-value { font: 400 2.5rem/1 var(--display); color: var(--accent); }
.r-sub { display: flex; justify-content: space-between; gap: 12px; font-size: .875rem; color: var(--muted); margin-top: -8px; }
.r-thanks { text-align: center; font-weight: 600; }

.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.act {
  display: grid; place-items: center; height: 44px; padding: 0 12px;
  border: 2px solid var(--line); border-radius: 12px;
  background: transparent; color: var(--ink); font-weight: 700; text-decoration: none; cursor: pointer; text-align: center;
}
.act:hover { border-color: var(--ink); }
.act.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

@media print {
  .no-print { display: none !important; }
  body { background: #fff; padding: 0; }
  .receipt-wrap { filter: none; }
  .receipt { background: #fff; color: #000; -webkit-mask: none; mask: none; padding: 0; }
  .r-shop, .r-total-value { color: #000; }
}
</style>

<div class="page bill-page">
  <div class="top no-print">
    <nav class="nav" id="nav" aria-label="Pages"></nav>
  </div>

  <form class="find no-print" id="find" novalidate>
    <label class="field" for="find-no">Bill number
      <input id="find-no" type="number" min="1" step="1" inputmode="numeric" placeholder="1043">
    </label>
    <button class="add-btn" type="submit">Open bill</button>
  </form>

  <p class="banner no-print" id="banner" role="alert" hidden></p>

  <div class="receipt-wrap" id="receipt-wrap" hidden>
    <article class="receipt" aria-label="E-bill">
      <header class="r-head">
        <h1 class="r-shop" id="shop-name">Icepops</h1>
        <div id="shop-lines"></div>
        <p class="r-tag">E-bill</p>
      </header>
      <dl class="r-meta" id="meta"></dl>
      <table class="r-items">
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      <div class="r-total"><span class="r-total-label">Total</span><span class="r-total-value" id="total"></span></div>
      <div class="r-sub"><span id="count"></span><span id="paid"></span></div>
      <p class="r-thanks">Thank you! Please visit again.</p>
    </article>
  </div>

  <div class="actions no-print" id="actions" hidden>
    <a class="act primary" id="wa-pdf" href="#" target="_blank" rel="noopener" hidden>Send PDF on WhatsApp</a>
    <a class="act" id="pdf" href="#" download>Download PDF</a>
    <a class="act" id="whatsapp" href="#" target="_blank" rel="noopener" hidden>Send as text</a>
    <button class="act" id="print" type="button">Print</button>
    <button class="act" id="copy" type="button">Copy bill text</button>
  </div>
  <p class="form-note no-print" id="copy-note" role="status"></p>
</div>

<script src="store.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let current = null;

function render(bill, items) {
  current = { bill, items };
  document.title = `${SHOP.name} bill ${bill.billNo}`;
  $("shop-name").textContent = SHOP.name;
  $("shop-lines").innerHTML = [ME && ME.outlets.length > 1 && bill.outlet, SHOP.address, SHOP.phone && `Phone ${SHOP.phone}`, SHOP.gstin && `GSTIN ${SHOP.gstin}`]
    .filter(Boolean).map((l) => `<p class="r-line">${esc(l)}</p>`).join("");

  const meta = [
    ["Bill no", bill.billNo, true],
    ["Date", `${billDate(bill)}, ${bill.time}`, true],
    bill.customer && ["Customer", bill.customer],
    bill.phone && ["Mobile", formatPhone(bill.phone), true]
  ].filter(Boolean);
  $("meta").innerHTML = meta.map(([k, v, mono]) => `<dt>${esc(k)}</dt><dd${mono ? ' class="mono"' : ""}>${esc(v)}</dd>`).join("");

  $("items").innerHTML = items.map((i) => `
    <tr><td class="item">${esc(i.flavour)}</td><td class="num">${i.qty}</td><td class="num">${money(i.price)}</td><td class="num">${money(i.lineTotal)}</td></tr>`).join("");
  $("total").textContent = money(bill.total);
  $("count").textContent = pops(bill.qty);
  $("paid").textContent = `Paid by ${bill.payment}`;

  const wa = whatsappLink(bill, items);
  $("whatsapp").hidden = !wa;
  $("wa-pdf").hidden = !wa;
  if (wa) {
    $("whatsapp").href = wa;
    $("wa-pdf").href = pdfChatLink(bill);
  }
  $("pdf").href = pdfUrl(bill, true);
  $("pdf").setAttribute("download", pdfName(bill));
  $("pdf").classList.toggle("primary", !wa);
  prefetchPdf(bill);

  $("find-no").value = bill.billNo;
  $("receipt-wrap").hidden = false;
  $("actions").hidden = false;
  $("copy-note").textContent = "";
}

async function openBill(no) {
  try {
    const { bill, items } = await api(`/api/bills/${encodeURIComponent(no)}`);
    showBanner("");
    render(bill, items);
    history.replaceState(null, "", `?no=${bill.billNo}`);
  } catch (e) {
    showBanner(e.message);
    $("receipt-wrap").hidden = true;
    $("actions").hidden = true;
  }
}

$("find").addEventListener("submit", (e) => {
  e.preventDefault();
  const no = $("find-no").value.trim();
  if (!/^\d+$/.test(no)) { showBanner("Enter a bill number, for example 1043."); return $("find-no").focus(); }
  openBill(no);
});

$("print").addEventListener("click", () => window.print());

$("wa-pdf").addEventListener("click", (e) => {
  if (current) $("copy-note").textContent = sendPdfOnWhatsApp(e, current.bill);
});

$("copy").addEventListener("click", () => {
  if (!current) return;
  const text = billText(current.bill, current.items);
  navigator.clipboard.writeText(text)
    .then(() => { $("copy-note").textContent = "Bill copied. Paste it into a message."; })
    .catch(() => { $("copy-note").textContent = "Copying isn't allowed here. Select the bill above and copy it instead."; });
});

startPage("bill").then((me) => {
  if (!me) return;
  const no = new URLSearchParams(location.search).get("no");
  if (no && /^\d+$/.test(no)) openBill(no);
  else $("find-no").focus();
});
</script>
</html>
